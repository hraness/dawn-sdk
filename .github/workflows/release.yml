name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build:
    # Checks the tag, then packs the tarball once. The GitHub Release and npm
    # both receive these exact bytes.
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $version is not a stable semantic version"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH"
            exit 1
          fi
          newest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not newer than $newest"
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts
          test "$(npm --version)" = "11.19.0"
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tarball="hraness-dawn-sdk-$version.tgz"
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist >/dev/null
          test "$(ls dist)" = "$tarball"
          (cd dist && sha256sum "$tarball" > SHA256SUMS)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.pack.outputs.tarball }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish an immutable release
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/* --verify-tag --generate-notes --latest --title "DAWN SDK $TAG"
          else
            # A re-run repacks; the release keeps its first bytes, so this
            # run's tarball must match them.
            mkdir published
            gh release download "$TAG" --dir published --pattern SHA256SUMS
            if ! cmp -s published/SHA256SUMS dist/SHA256SUMS; then
              echo "::error::Release $TAG already holds different bytes than this run built"
              exit 1
            fi
          fi
          state="$(gh release view "$TAG" --json isDraft,isPrerelease,isImmutable,assets \
            --jq '[.isDraft, .isPrerelease, .isImmutable, (.assets | length)] | @tsv')"
          if [[ "$state" != $'false\tfalse\ttrue\t2' ]]; then
            echo "::error::Release $TAG is not published and immutable with 2 assets ($state)"
            exit 1
          fi

  npm:
    # Mirrors the release tarball to npm through trusted publishing: the
    # registry exchanges this job's OIDC token for a short-lived credential, so
    # no npm token is stored. CONTRIBUTING.md lists the one-time setup.
    name: npm mirror
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NAME: "@hraness/dawn-sdk"
      TAG: ${{ needs.build.outputs.tag }}
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts
          test "$(npm --version)" = "11.19.0"
      - name: Download the published release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir dist
      - name: Publish the release tarball
        run: |
          set -euo pipefail
          if [[ -z "$TAG" || "$TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          version="${TAG#v}"
          probe="$RUNNER_TEMP/npm-view.txt"
          if ! npm view "$NAME" name --json >/dev/null 2>"$probe"; then
            if grep -q E404 "$probe"; then
              echo "::warning::$NAME is not on npm yet, so trusted publishing cannot run. CONTRIBUTING.md lists the one-time setup."
              exit 0
            fi
            cat "$probe"; exit 1
          fi
          if npm view "$NAME@$version" version --json >/dev/null 2>"$probe"; then
            echo "::notice::$NAME@$version is already on npm"
            exit 0
          elif ! grep -q E404 "$probe"; then
            cat "$probe"; exit 1
          fi
          npm publish "dist/$TARBALL" --access public --provenance --ignore-scripts
          for _ in $(seq 1 10); do
            predicate="$(npm view "$NAME@$version" dist.attestations.provenance.predicateType --prefer-online 2>/dev/null || true)"
            if [[ "$predicate" == "https://slsa.dev/provenance/v1" ]]; then
              echo "Published $NAME@$version with provenance"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm does not report $NAME@$version with provenance"
          exit 1
